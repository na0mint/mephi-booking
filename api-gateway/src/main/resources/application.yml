server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
security:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-me-32-bytes-minimum}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
