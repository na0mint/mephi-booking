server:
  port: ${PORT:8082}
spring:
  application:
    name: booking-service
  cloud:
    loadbalancer:
      retry:
        enabled: false
  datasource:
    url: jdbc:h2:mem:bookingservice;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
demo:
  seed: ${DEMO_SEED:true}
security:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-me-32-bytes-minimum}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
